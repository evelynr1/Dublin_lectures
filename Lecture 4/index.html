<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My lightbox photo gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="dist/css/lightbox.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1>My lightbox photo gallery</h1>
    </header>
    <main>
        <div class="grid">
        <!-- put 4 images (each one in a link) -->
        <!-- we'll make 4 lightbox images -->
        <a href="images/Brazen_Head_Brownie_with_Ice_Cream.jpg" data-lightbox="group1">
            <img src="images/Brazen_Head_Brownie_with_Ice_Cream.jpg" width= "200" alt="Square brownie next to single scoop of vanilla ice cream on a white plate">
        </a>
        <a href="images/Dublin_zoo_sheep_and_pigeon.jpg" data-lightbox="group1">
            <img src="images/Dublin_zoo_sheep_and_pigeon.jpg" width= "200" alt="Sheep in the corner of a small barn eating hay">
        </a>
        <a href="images/Dublin_zoo_sheep_with_sheep_sign.jpg" data-lightbox="group2">
            <img src="images/Dublin_zoo_sheep_with_sheep_sign.jpg" width= "200" alt="A sign about sheep on the fence of an enclosure with four sheep in the background">
        </a>
        <a href="images/One_Kinda_Folk_Pear_Almond_Danish.jpg" data-lightbox="group2">
            <img src="images/One_Kinda_Folk_Pear_Almond_Danish.jpg" width= "200" alt="ear almond danish on a paper bag">
        </a>
        </div>
        
    </main>
    <!-- javascript code goes at the bottom of HTML -->
    <script src="dist/js/lightbox-plus-jquery.js"></script>
</body>
</html>
